<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2f5d8c">
<title>서울 도심 가이드 투어 · 10/24</title>
<meta name="description" content="안국역에서 인사동·청계천·명동을 지나 N서울타워까지. 드래그로 순서 변경, Pass로 건너뛰기.">
<link rel="stylesheet" href="../navi/navi.css">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
      integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="">
<!-- 이 페이지에서 설치하면 이 페이지로 열리는 앱 (언어별 설치 설정) -->
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="../navi/icons/icon-192.png">
<meta name="apple-mobile-web-app-title" content="서울 투어">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="icon" type="image/png" href="../navi/icons/icon-192.png">
<style>
  /* 서울 투어 강조색 (남색) */
  :root { --accent: #2f5d8c; --accent-soft: #5b85b3; }
  @media (prefers-color-scheme: dark) {
    :root { --accent: #8db8e6; --accent-soft: #6a98c8; }
  }
</style>
</head>
<body>

<header class="tour-header">
  <div class="kicker">2026.10.24 · Seoul</div>
  <h1></h1>
  <p class="subtitle"></p>
  <div class="tour-meta">
    <div class="item total-km"><div class="val">—</div><div class="key">총 도보</div></div>
    <div class="item total-time"><div class="val">—</div><div class="key">소요</div></div>
    <div class="item stops-count"><div class="val">—</div><div class="key">정거장</div></div>
  </div>
</header>

<div id="info-card-slot"></div>

<div class="progress-bar">
  <button id="btn-scroll-top" class="btn-scroll-top" aria-label="맨 위로" title="맨 위로">⬆</button>
  <span class="count">0 / 0</span>
  <div class="track"><div class="fill"></div></div>
  <button id="btn-edit-sheet" class="btn-edit-sheet" aria-label="동선 편집">▼ 동선 편집</button>
  <button id="btn-reset-order" class="btn-reset-order" aria-label="순서 초기화" title="순서·Pass 초기화">↺</button>
</div>

<div id="sheet-backdrop" class="sheet-backdrop"></div>
<section id="edit-sheet" class="edit-sheet" aria-label="동선 편집 시트">
  <div class="sheet-help">
    <strong>⠿</strong>를 길게 눌러 드래그 · <strong>✕</strong>로 동선 제외 · 변경 시 위 지도가 즉시 갱신됩니다.
  </div>
  <div id="sheet-list" class="sheet-list"></div>
  <button id="btn-close-sheet" class="btn-close-sheet">▲ 닫기</button>
</section>

<div id="overview-map" class="overview-map" aria-label="전체 루트 지도"></div>

<div style="padding: 10px 16px; font-size: 12px; color: var(--ink-soft); background: var(--bg-card); border-bottom: 1px solid var(--line); line-height: 1.55;">
  💡 회색으로 빠져 있는 <strong>대안</strong> 정거장(탑골공원·동대입구)은 <strong>↶ 복귀</strong>로 넣을 수 있어요. 점선 구간은 버스입니다.
  <div id="map-credit" style="margin-top: 4px; font-size: 10.5px; color: var(--ink-mute);"></div>
</div>

<main>
  <section id="stops-container" class="stops"></section>
</main>

<footer class="tour-footer">
  <p>서울 도심 도보 투어 · 2026년 10월 24일 · <a href="eng.html">English</a> · <a href="vn.html">Tiếng Việt</a></p>
  <p><a href="../">← 투어 목록으로</a></p>
</footer>

<nav class="bottom-nav" aria-label="정거장 네비게이션">
  <button class="prev"><span class="label">← 이전</span><span class="target">—</span></button>
  <div class="center">
    <div class="current">01</div>
    <div style="font-size: 10px; color: var(--ink-mute);">/ <span class="total">—</span></div>
  </div>
  <button class="next"><span class="label">다음 →</span><span class="target">—</span></button>
</nav>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
        integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
<script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.2/Sortable.min.js"></script>
<script src="stops-data.js"></script>
<script src="routes-data.js"></script>
<script src="../navi/navi-core.js"></script>
<script src="../navi/map-kit.js"></script>
<script src="../navi/v3-flex.js"></script>
<script>
  (function () {
    const { NaviCore } = window;
    NaviCore.fillHeader();
    NaviCore.injectCards(document.getElementById('info-card-slot'));
    window.V3Flex.init();
  })();
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('../sw.js').catch((e) => console.warn('SW failed:', e));
    });
  }
</script>
</body>
</html>
